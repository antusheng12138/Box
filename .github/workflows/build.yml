name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 准备固定签名
        run: |
          mkdir -p signing ~/.android
          if [ ! -f signing/debug.keystore ]; then
            keytool -genkeypair -v -keystore signing/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp signing/debug.keystore ~/.android/debug.keystore
      - name: 生成自定义图标
        run: |
          (command -v convert >/dev/null 2>&1) || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          convert icon-src.jpg -resize 512x512! app/src/main/res/drawable/app_icon.png
          echo "icon done"
      - name: 编译 arm64 release
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleArm64GenericNormalRelease --no-daemon
      - name: 回存签名（仅首次）
        run: |
          git config user.name "bot"
          git config user.email "bot@local"
          git add signing/debug.keystore
          git commit -m "chore: 固定签名" || true
          git push || true
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom
          name: 安徒生定制版
          files: app/build/outputs/apk/**/release/*.apk

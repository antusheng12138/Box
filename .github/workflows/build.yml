name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 编译 arm64 release
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleArm64GenericNormalRelease --no-daemon
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom
          name: 安徒生定制版
          files: app/build/outputs/apk/**/release/*.apk
